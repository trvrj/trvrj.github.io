<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Auth | Trevor Johnson</title>
    <link rel="stylesheet" href="../../styles.css?v=1">
</head>
<body>
    <main>
        <p class="info-text"><a href="../../index.html">Back to Home</a></p>
        <h2>&lt; Dashboard Auth &gt;</h2>
        <p class="info-text">Sign in with Google to access dashboard moderation.</p>
        <p class="info-text">Mobile browsers can handle Google sign-in differently. If sign-in flashes, immediately closes, or mentions missing initial state, use the alternate option below.</p>

        <section class="feedback-form-section">
            <button id="dashboardAuthSignInBtn" type="button">Sign in with Google</button>
            <p class="info-text"><button id="dashboardAuthAlternateSignInBtn" class="feedback-toggle-btn" type="button">Try alternate sign-in</button></p>
            <p id="dashboardAuthStatus" class="info-text" aria-live="polite"></p>
        </section>
    </main>

    <script type="module" src="../../scripts/dashboardAuthPage.js"></script>
</body>
</html>
